<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海水缸紀錄</title>
<meta name="theme-color" content="#5f7f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="海水缸">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#f4f3f0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#33393d}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#f4f3f0}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f4f3f0;z-index:2;transition:opacity .3s}
  #splash img{width:84px;height:84px;border-radius:20px}
  #splash .t{font-size:17px;font-weight:600;letter-spacing:1px}
  #splash .m{font-size:13px;color:#7a8086;min-height:18px;text-align:center;padding:0 24px;line-height:1.6}
  #splash button{border:1px solid #5f7f8f;background:#e6edf0;color:#4a6878;border-radius:10px;padding:8px 18px;font-size:14px;font-family:inherit}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="t">海水缸紀錄</div>
  <div class="m" id="msg">讀取中…</div>
  <button id="reload" hidden>重新載入</button>
</div>
<script>
/* ===== 設定 =====
 * 不用改這個檔：網址帶 ?s=部署ID&k=密鑰 第一次打開後就會記住。
 * （也可以把部署網址直接填在 GAS_URL，就不需要 s=。）
 */
var GAS_URL = '';

(function () {
  var msg = document.getElementById('msg'), btn = document.getElementById('reload'), splash = document.getElementById('splash');
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var q = new URLSearchParams(location.search);
  // 網址帶 k= / s= 就記住；沒帶就用上次記住的
  var key = q.get('k') || store('reefKey') || '';
  if (/^[A-Za-z0-9]{16,64}$/.test(key)) store('reefKey', key); else key = '';
  var sid = q.get('s') || store('reefSid') || '';
  if (/^[A-Za-z0-9_-]{20,120}$/.test(sid)) store('reefSid', sid); else sid = '';
  var base = GAS_URL || (sid ? 'https://script.google.com/macros/s/' + sid + '/exec' : '');
  btn.onclick = function () { location.reload(); };
  if (!key) { msg.textContent = '請用你的專屬網址開啟（網址要有 k=…）'; return; }
  if (!base) { msg.textContent = '網址缺少 s=（部署ID），請用 myLink 印出的專屬網址開啟'; return; }

  var f = document.createElement('iframe');
  f.id = 'app'; f.title = '海水缸紀錄';
  f.allow = 'camera';
  var loaded = false;
  f.onload = function () { loaded = true; splash.classList.add('hide'); };
  f.src = base + '?k=' + encodeURIComponent(key);
  document.body.appendChild(f);
  setTimeout(function () { if (!loaded) { msg.textContent = '連線比較久，請稍候…'; btn.hidden = false; } }, 6000);
  setTimeout(function () { if (!loaded) { msg.textContent = '連不上，請檢查網路後按「重新載入」'; } }, 15000);
})();
</script>
</body>
</html>
